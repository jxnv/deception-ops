# Kubernetes Decoy Configuration Template
# Target: Staging Pods, Developer Workstations (~/.kube/config), CI/CD Runners
apiVersion: v1
kind: Config
preferences: {}
current-context: canary-staging-cluster-admin

clusters:
- cluster:
    # Canary HTTP beacon endpoint acting as simulated Kube-API server
    server: {{SERVER_URL}}
    insecure-skip-tls-verify: true
  name: staging-k8s-us-east-1

contexts:
- context:
    cluster: staging-k8s-us-east-1
    namespace: kube-system
    user: staging-cluster-admin-canary
  name: canary-staging-cluster-admin

users:
- name: staging-cluster-admin-canary
  user:
    token: canary-k8s-jwt-{{TOKEN_ID}}-secret-cluster-access-token
